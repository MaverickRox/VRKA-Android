name: Build VRKA Browser APK

on:
  push:
    branches:
      - feature/browser-toolbar-v5.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "platforms;android-37-ext2" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Build development-signed APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDevRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRKA-browser-dev-apk
          path: app/build/outputs/apk/devRelease/*.apk
          if-no-files-found: error
          retention-days: 14
